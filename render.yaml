# Déploiement du frontend sur Render (site statique).
# Render lit ce fichier pour créer le service ("Blueprint"). Voir README §6.
services:
  - type: web
    name: gestion-planning-cop1
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Renseigne ces deux valeurs dans le dashboard Render (onglet Environment)
    # AVANT le premier déploiement — Vite les intègre au build.
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    # SPA : toutes les routes (/planning/..., /p/..., /semaine) servent index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
